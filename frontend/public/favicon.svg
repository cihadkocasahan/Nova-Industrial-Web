  <line x1="32" y1="32" x2="47" y2="17" stroke="#15803d" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="47" y2="47" stroke="#15803d" stroke-width="2.8" stroke-linecap="round"/>
