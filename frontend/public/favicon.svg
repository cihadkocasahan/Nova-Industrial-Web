  <circle cx="47" cy="17" r="2.5" fill="#16a34a"/>
  <circle cx="47" cy="47" r="6" fill="none" stroke="#84cc16" stroke-width="1.8"/>
  <circle cx="47" cy="47" r="2.5" fill="#16a34a"/>
  <circle cx="17" cy="47" r="6" fill="none" stroke="#84cc16" stroke-width="1.8"/>
  <circle cx="17" cy="47" r="2.5" fill="#16a34a"/>

  <!-- Central Agricultural Sprout -->
  <path d="M 32,36 C 27,29 22,21 24,14 C 30,14 33,22 32,36 Z" fill="url(#fav-green)"/>
  <path d="M 32,36 C 35,26 42,19 46,12 C 47,21 41,30 32,36 Z" fill="url(#fav-lime)"/>
