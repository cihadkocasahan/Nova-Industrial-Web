<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a5d6a7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#66bb6a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="800" height="500" fill="url(#skyGrad)"/>
  <!-- Field rows -->
  <rect x="0" y="320" width="800" height="180" fill="url(#fieldGrad)"/>
  <rect x="0" y="330" width="800" height="4" fill="#81c784" opacity="0.6"/>
  <rect x="0" y="350" width="800" height="4" fill="#81c784" opacity="0.6"/>
  <rect x="0" y="370" width="800" height="4" fill="#81c784" opacity="0.6"/>
  <rect x="0" y="390" width="800" height="4" fill="#81c784" opacity="0.6"/>
  <rect x="0" y="410" width="800" height="4" fill="#66bb6a" opacity="0.5"/>
  <rect x="0" y="430" width="800" height="4" fill="#66bb6a" opacity="0.5"/>
  <!-- Drone body -->
  <ellipse cx="400" cy="200" rx="40" ry="14" fill="#2e7d32"/>
  <rect x="365" y="192" width="70" height="16" rx="6" fill="#388e3c"/>
  <!-- Drone arms -->
  <line x1="360" y1="200" x2="300" y2="170" stroke="#2e7d32" stroke-width="5" stroke-linecap="round"/>
  <line x1="440" y1="200" x2="500" y2="170" stroke="#2e7d32" stroke-width="5" stroke-linecap="round"/>
  <line x1="360" y1="200" x2="300" y2="230" stroke="#2e7d32" stroke-width="5" stroke-linecap="round"/>
  <line x1="440" y1="200" x2="500" y2="230" stroke="#2e7d32" stroke-width="5" stroke-linecap="round"/>
  <!-- Drone propellers -->
  <ellipse cx="300" cy="170" rx="30" ry="5" fill="#1b5e20" opacity="0.8"/>
  <ellipse cx="500" cy="170" rx="30" ry="5" fill="#1b5e20" opacity="0.8"/>
  <ellipse cx="300" cy="230" rx="30" ry="5" fill="#1b5e20" opacity="0.8"/>
  <ellipse cx="500" cy="230" rx="30" ry="5" fill="#1b5e20" opacity="0.8"/>
  <!-- Spray dots -->
  <circle cx="370" cy="240" r="3" fill="#64b5f6" opacity="0.8"/>
  <circle cx="385" cy="255" r="3" fill="#64b5f6" opacity="0.8"/>
  <circle cx="400" cy="265" r="3" fill="#64b5f6" opacity="0.8"/>
  <circle cx="415" cy="255" r="3" fill="#64b5f6" opacity="0.8"/>
  <circle cx="430" cy="240" r="3" fill="#64b5f6" opacity="0.8"/>
  <circle cx="360" cy="270" r="2" fill="#90caf9" opacity="0.7"/>
  <circle cx="440" cy="270" r="2" fill="#90caf9" opacity="0.7"/>
  <!-- Label -->
  <rect x="0" y="0" width="800" height="500" fill="none"/>
  <text x="400" y="470" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#1b5e20" opacity="0.7">Nova Agro — Zirai Drone İlaçlama</text>
</svg>
